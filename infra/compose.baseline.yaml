name: ${LIFE_COMPOSE_PROJECT:-lifecompanion-upstream}

services:
  memos:
    image: neosmemo/memos:26.10.0
    ports:
      - "${LIFE_BIND_ADDRESS:-127.0.0.1}:${LIFE_MEMOS_PORT:-5230}:5230"
    environment:
      TZ: Asia/Hong_Kong
      MEMOS_BOOTSTRAP_ADMIN_PASSWORD: ${MEMOS_BOOTSTRAP_ADMIN_PASSWORD:?set MEMOS_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./volumes/memos:/var/opt/memos
      - ./memos-config:/etc/memos/config:ro
    restart: unless-stopped

  librechat:
    image: ghcr.io/librechat-ai/librechat:v0.8.8
    ports:
      - "${LIFE_BIND_ADDRESS:-127.0.0.1}:${LIFE_LIBRECHAT_PORT:-3080}:3080"
    env_file:
      - path: ../products/librechat-custom/.env
        required: true
      - path: ../model_api_keys.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongo:27017/LibreChat
      MEILI_HOST: http://meili:7700
      SCHEDULES_SINGLE_PROCESS: "true"
      LIFE_CORE_URL: ${LIFE_CORE_HOST_URL:-http://host.docker.internal:8010}
      LIFE_INTERNAL_TOKEN: ${LIFE_INTERNAL_TOKEN:?set LIFE_INTERNAL_TOKEN}
      LIFE_CORE_INGEST_TIMEOUT_MS: "4000"
      DOMAIN_CLIENT: ${LIFE_PUBLIC_URL:?set LIFE_PUBLIC_URL}
      DOMAIN_SERVER: ${LIFE_CHAT_INTERNAL_URL:?set LIFE_CHAT_INTERNAL_URL}
      ALLOW_REGISTRATION: ${LIFE_ALLOW_REGISTRATION:-false}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CREDS_KEY: ${CREDS_KEY:?set CREDS_KEY}
      CREDS_IV: ${CREDS_IV:?set CREDS_IV}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      TZ: Asia/Hong_Kong
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../products/librechat-custom/.env:/app/.env:ro
      - ../products/librechat-custom/librechat.yaml:/app/librechat.yaml:ro
      - ../products/librechat-custom/api/app/clients/BaseClient.js:/app/api/app/clients/BaseClient.js:ro
      - ../products/librechat-custom/images:/app/client/public/images
      - ../products/librechat-custom/uploads:/app/uploads
      - ../products/librechat-custom/logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      meili:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:8.0.20
    command: mongod --noauth
    volumes:
      - ./volumes/librechat-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  meili:
    image: getmeili/meilisearch:v1.35.1
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
    volumes:
      - ./volumes/librechat-meili:/meili_data
    restart: unless-stopped

